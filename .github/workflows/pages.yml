name: pages

# Builds Highfield and publishes it to this repo's GitHub Pages site. A
# project site of yakovkhalinsky, so it is served under the user site's
# custom domain at https://yakov.khalinsky.com/highfield/, as margin and
# gr00ve are. The build is relative throughout (vite base "./"), so
# nothing here names the sub-path.
#
# Starts after ci succeeds on a push to main (tests already ran there).
# workflow_dispatch republishes the current ref by hand.
#
# Needs, once: Settings → Pages → Source "GitHub Actions"
#   gh api -X POST repos/yakovkhalinsky/highfield/pages -f build_type=workflow
# Until then the deploy job fails and nothing is published.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# nothing by default; each job asks for what it uses
permissions: {}

# one deploy at a time; a newer push waits for the one in flight rather
# than cancelling it halfway through a publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    # only main publishes, even by hand from another branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
