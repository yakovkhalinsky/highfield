name: ci

# Highfield: TypeScript estate engine forked from llm-world. Generation and
# vendored page3d (except the visual fork) still pin to reference.json;
# day ticks and rules.json are Highfield-owned and covered by unit tests.
#   test     on every push and PR: typecheck, tests, gen parity, build.
#   full     weekly and by hand: longer Highfield balance fingerprint and
#            vendor check against llm-world main (page3d drift signal).
# pages.yml starts after a successful push-to-main ci run.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: ref
        run: echo "sha=$(jq -r .sha reference.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: yakovkhalinsky/llm-world
          ref: ${{ steps.ref.outputs.sha }}
          path: .reference/llm-world
          sparse-checkout: |
            apps/estate
            apps/shared
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci
      - run: npm test
      - run: npm run build

  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        against: [pinned, main]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: ref
        env:
          AGAINST: ${{ matrix.against }}
        run: |
          if [ "$AGAINST" = main ]; then echo "sha=main"; else echo "sha=$(jq -r .sha reference.json)"; fi >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: yakovkhalinsky/llm-world
          ref: ${{ steps.ref.outputs.sha }}
          path: .reference/llm-world
          sparse-checkout: |
            apps/estate
            apps/shared
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: npm ci
      # page3d vendor drift vs upstream (rules/tick hashes are Highfield-owned)
      - if: matrix.against == 'main'
        env:
          LLM_WORLD: .reference/llm-world
        run: npx vitest run tests/vendor.test.ts
      - name: Highfield balance fingerprint (deterministic)
        run: |
          a=$(npm run --silent balance -- --fingerprint)
          b=$(npm run --silent balance -- --fingerprint)
          echo "fingerprint $a"
          test -n "$a" && test "$a" = "$b"
